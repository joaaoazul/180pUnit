[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achados"
version = "0.1.0"
description = "Scraper de portais imobiliários que ordena anúncios por potencial de bom negócio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
achados = "achados.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
